[build-system]
requires = [
  "setuptools>=77",
  "setuptools-scm>=10.2.0"
]
build-backend = "setuptools.build_meta"


[project]
name = "kognic-auth"
dynamic = ["version"]
authors = [
    { name = "Kognic", email = "michel.edkrantz@kognic.com" },
]
description = "Kognic Authentication"
dependencies = [
    "authlib>=0.14.1,<1.8"
]
requires-python=">=3.10"
readme = "README.md"
keywords = ["Kognic", "API"]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
]
[project.urls]
homepage = "https://github.com/annotell/kognic-auth-python"
source = "https://github.com/annotell/kognic-auth-python"
"release notes" = "https://github.com/annotell/kognic-auth-python/releases"

[project.scripts]
kognic-auth = "kognic.auth.cli:main"
kog = "kognic.auth.cli.api_request:main"

[tool.setuptools.package-data]
"kognic.auth" = ["py.typed"]

[tool.setuptools_scm]
version_file = "src/kognic/auth/_version.py"
# kognic.auth imports __version__ from the generated file, so it has to reach
# the source tree and not only the build directory.
write_to_source = true

[project.optional-dependencies]
httpx = [
    "httpx>=0.20,<1"
]
requests = [
    "requests>=2.33,<3"
]

cli = [
    "keyring>=23.0",
    "requests>=2.33,<3"
]

full = [
    "httpx>=0.20,<1",
    "requests>=2.33,<3",
    "keyring>=23.0"
]

[dependency-groups]
dev = [
    "httpx>=0.20,<1",
    "requests>=2.33,<3",
    "pytest",
    "keyring>=23.0",
    "pytest-asyncio>=1.4.0",
    "pyright>=1.1.400,<2",
]

[tool.pyright]
# pythonVersion is deliberately unset: pyright infers it from the interpreter, so the
# build matrix typechecks against every supported version rather than a single pinned
# one. Matters most for reportDeprecated, since typeshed gates @deprecated on the
# target version (e.g. datetime.utcnow() is only deprecated from 3.12).
include = ["src", "tests"]
stubPath = "stubs"
exclude = ["src/kognic/auth/_version.py"]
strict = ["src", "tests"]
reportDeprecated = "error"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["src/kognic/auth/_version.py"]

[tool.ruff.lint]
select = ["E", "F", "B", "W", "I001", "PTH"]
