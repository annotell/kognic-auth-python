[build-system]
requires = [
  "setuptools>45",
  "setuptools_scm[toml]>=6.2"
]
build-backend = "setuptools.build_meta"


[project]
name = "kognic-auth"
dynamic = ["version"]
authors = [
    { name = "Kognic", email = "michel.edkrantz@kognic.com" },
]
description = "Kognic Authentication"
dependencies = [
    "authlib>=0.14.1,<1.8"
]
requires-python=">=3.10"
readme = "README.md"
keywords = ["Kognic", "API"]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
]
[project.urls]
homepage = "https://github.com/annotell/kognic-auth-python"
source = "https://github.com/annotell/kognic-auth-python"
"release notes" = "https://github.com/annotell/kognic-auth-python/releases"

[project.scripts]
kognic-auth = "kognic.auth.cli:main"
kog = "kognic.auth.cli.api_request:main"

[tool.setuptools_scm]
write_to = "src/kognic/auth/_version.py"

[project.optional-dependencies]
httpx = [
    "httpx>=0.20,<1"
]
requests = [
    "requests>=2.20,<3"
]

cli = [
    "keyring>=23.0",
    "requests>=2.20,<3"
]

full = [
    "httpx>=0.20,<1",
    "requests>=2.20,<3",
    "keyring>=23.0"
]

[dependency-groups]
dev = [
    "httpx>=0.20,<1",
    "requests>=2.20,<3",
    "pytest",
    "keyring>=23.0",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["src/kognic/auth/_version.py"]

[tool.ruff.lint]
select = ["E", "F", "B", "W", "I001", "PTH"]
